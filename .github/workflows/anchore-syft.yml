# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, builds an image, performs a container image
# scan with Anchore's Syft tool, and uploads the results to the GitHub Dependency
# submission API.

# For more information on the Anchore sbom-action usage
# and parameters, see https://github.com/anchore/sbom-action. For more
# information about the Anchore SBOM tool, Syft, see
# https://github.com/anchore/syft
name: SBOM Vulnerability Scan

on:
  push:
    branches:
      - main
      - test-openvex-workflow
  workflow_dispatch:

jobs:
  sbom-scan:
    permissions:
      contents: read
      security-events: write

    uses: TaniaGithub0401/github-workflows/.github/workflows/sbom-vulnerability-scan.yml@add-openvex-cra-reporting

    with:
      pyproject: pyproject.toml
      fail-build: false
      dependency-track: true
      dependency-track-url: https://dependency-track.mundialis.de
      dependency-track-project-name: actinia-core
      dependency-track-project-version: python-test

    secrets:
      dependency-track-api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
